<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>法律助手 - 管理后台</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: #f5f5f5;
      color: #333;
    }

    /* 顶部导航 */
    .navbar {
      background: #1a6fb5;
      color: #fff;
      padding: 0 24px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .navbar .logo { font-size: 18px; font-weight: 600; }
    .navbar .btn-logout {
      background: rgba(255,255,255,0.15);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.3);
      padding: 6px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
    }

    /* 布局 */
    .layout { display: flex; height: calc(100vh - 56px); }
    .sidebar {
      width: 200px;
      background: #fff;
      border-right: 1px solid #eee;
      padding: 16px 0;
      flex-shrink: 0;
    }
    .nav-item {
      padding: 14px 24px;
      cursor: pointer;
      font-size: 14px;
      color: #666;
      border-left: 3px solid transparent;
      transition: all .2s;
    }
    .nav-item:hover { background: #f5f9ff; }
    .nav-item.active {
      color: #1a6fb5;
      background: #e8f2fb;
      border-left-color: #1a6fb5;
      font-weight: 500;
    }

    .main {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
    }

    /* 看板卡片 */
    .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 24px; }
    .stat-card {
      background: #fff;
      border-radius: 12px;
      padding: 24px;
    }
    .stat-card .label { font-size: 13px; color: #999; margin-bottom: 8px; }
    .stat-card .value { font-size: 32px; font-weight: 700; color: #1a6fb5; }
    .stat-card .sub { font-size: 12px; color: #aaa; margin-top: 4px; }

    /* 表格区域 */
    .panel {
      background: #fff;
      border-radius: 12px;
      padding: 24px;
    }
    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .panel-title { font-size: 16px; font-weight: 600; }
    .btn {
      padding: 8px 20px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-size: 13px;
    }
    .btn-primary { background: #1a6fb5; color: #fff; }
    .btn-danger { background: #f44336; color: #fff; }
    .btn-sm { padding: 4px 12px; font-size: 12px; }

    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid #f0f0f0; font-size: 13px; }
    th { color: #999; font-weight: 500; background: #fafafa; }
    tr:hover td { background: #fafbfd; }

    /* 状态标签 */
    .tag {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 500;
    }
    .tag-pending { background: #fff3e0; color: #ff9800; }
    .tag-paid { background: #e3f2fd; color: #1a6fb5; }
    .tag-delivering { background: #e8f5e9; color: #4caf50; }
    .tag-completed { background: #e8f5e9; color: #2e7d32; }
    .tag-cancelled { background: #f5f5f5; color: #999; }
    .tag-refunded { background: #fce4ec; color: #e91e63; }

    /* 弹窗 */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.show { display: flex; }
    .modal {
      background: #fff;
      border-radius: 12px;
      padding: 32px;
      width: 520px;
      max-height: 80vh;
      overflow-y: auto;
    }
    .modal h3 { margin-bottom: 20px; font-size: 18px; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 13px; color: #555; margin-bottom: 6px; font-weight: 500; }
    .form-group input, .form-group textarea, .form-group select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
    }
    .form-group textarea { min-height: 80px; resize: vertical; font-family: inherit; }
    .form-actions { display: flex; gap: 12px; justify-content: flex-end; margin-top: 24px; }
    .btn-cancel { background: #f5f5f5; color: #666; }

    .section { display: none; }
    .section.active { display: block; }

    /* 响应式 */
    @media (max-width: 768px) {
      .cards { grid-template-columns: 1fr 1fr; }
      .sidebar { width: 140px; }
    }
  </style>
</head>
<body>
  <div class="navbar">
    <span class="logo">⚖️ 法律助手 - 管理后台</span>
    <button class="btn-logout" onclick="logout()">退出</button>
  </div>

  <div class="layout">
    <!-- 侧边栏 -->
    <div class="sidebar">
      <div class="nav-item active" data-section="dashboard" onclick="switchTab('dashboard')">
        📊 数据看板
      </div>
      <div class="nav-item" data-section="products" onclick="switchTab('products')">
        📦 产品管理
      </div>
      <div class="nav-item" data-section="categories" onclick="switchTab('categories')">
        📁 分类管理
      </div>
      <div class="nav-item" data-section="orders" onclick="switchTab('orders')">
        📋 订单管理
      </div>
      <div class="nav-item" data-section="users" onclick="switchTab('users')">
        👥 用户管理
      </div>
    </div>

    <!-- 主区域 -->
    <div class="main">
      <!-- 数据看板 -->
      <div class="section active" id="section-dashboard">
        <div class="cards">
          <div class="stat-card">
            <div class="label">总订单数</div>
            <div class="value" id="stat-total-orders">-</div>
          </div>
          <div class="stat-card">
            <div class="label">今日订单</div>
            <div class="value" id="stat-today-orders">-</div>
          </div>
          <div class="stat-card">
            <div class="label">总收入</div>
            <div class="value" id="stat-total-revenue">-</div>
          </div>
          <div class="stat-card">
            <div class="label">今日收入</div>
            <div class="value" id="stat-today-revenue">-</div>
          </div>
          <div class="stat-card">
            <div class="label">总用户数</div>
            <div class="value" id="stat-total-users">-</div>
          </div>
          <div class="stat-card">
            <div class="label">今日新增用户</div>
            <div class="value" id="stat-today-users">-</div>
          </div>
        </div>
      </div>

      <!-- 产品管理 -->
      <div class="section" id="section-products">
        <div class="panel">
          <div class="panel-header">
            <span class="panel-title">产品列表</span>
            <button class="btn btn-primary" onclick="openProductModal()">+ 新增产品</button>
          </div>
          <table>
            <thead>
              <tr>
                <th>ID</th><th>名称</th><th>分类</th><th>价格(元)</th><th>状态</th><th>排序</th><th>操作</th>
              </tr>
            </thead>
            <tbody id="product-tbody"></tbody>
          </table>
        </div>
      </div>

      <!-- 分类管理 -->
      <div class="section" id="section-categories">
        <div class="panel">
          <div class="panel-header">
            <span class="panel-title">分类列表</span>
            <button class="btn btn-primary" onclick="openCategoryModal()">+ 新增分类</button>
          </div>
          <table>
            <thead>
              <tr><th>ID</th><th>图标</th><th>名称</th><th>排序</th><th>状态</th><th>操作</th></tr>
            </thead>
            <tbody id="category-tbody"></tbody>
          </table>
        </div>
      </div>

      <!-- 订单管理 -->
      <div class="section" id="section-orders">
        <div class="panel">
          <div class="panel-header">
            <span class="panel-title">订单列表</span>
            <select id="order-status-filter" onchange="loadOrders()">
              <option value="">全部状态</option>
              <option value="pending">待支付</option>
              <option value="paid">已支付</option>
              <option value="delivering">服务中</option>
              <option value="completed">已完成</option>
              <option value="cancelled">已取消</option>
              <option value="refunded">已退款</option>
            </select>
          </div>
          <table>
            <thead>
              <tr>
                <th>ID</th><th>订单号</th><th>产品</th><th>用户</th><th>金额</th><th>状态</th><th>时间</th><th>操作</th>
              </tr>
            </thead>
            <tbody id="order-tbody"></tbody>
          </table>
        </div>
      </div>

      <!-- 用户管理 -->
      <div class="section" id="section-users">
        <div class="panel">
          <div class="panel-header"><span class="panel-title">用户列表</span></div>
          <table>
            <thead>
              <tr><th>ID</th><th>昵称</th><th>手机号</th><th>来源</th><th>注册时间</th></tr>
            </thead>
            <tbody id="user-tbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- 产品编辑弹窗 -->
  <div class="modal-overlay" id="product-modal">
    <div class="modal">
      <h3 id="product-modal-title">新增产品</h3>
      <form id="product-form">
        <input type="hidden" id="prod-id">
        <div class="form-group">
          <label>产品名称 *</label>
          <input type="text" id="prod-name" required>
        </div>
        <div class="form-group">
          <label>副标题</label>
          <input type="text" id="prod-subtitle">
        </div>
        <div class="form-group">
          <label>分类 *</label>
          <select id="prod-category" required></select>
        </div>
        <div class="form-group">
          <label>售价(元) *</label>
          <input type="number" id="prod-price" step="0.01" required>
        </div>
        <div class="form-group">
          <label>原价(元)</label>
          <input type="number" id="prod-original-price" step="0.01">
        </div>
        <div class="form-group">
          <label>场景描述</label>
          <textarea id="prod-scenario" placeholder="唤醒用户痛点"></textarea>
        </div>
        <div class="form-group">
          <label>ROI提示</label>
          <textarea id="prod-roi" placeholder="帮用户算账"></textarea>
        </div>
        <div class="form-group">
          <label>排序</label>
          <input type="number" id="prod-sort" value="0">
        </div>
        <div class="form-group">
          <label>上架</label>
          <select id="prod-active">
            <option value="1">是</option>
            <option value="0">否</option>
          </select>
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-cancel" onclick="closeProductModal()">取消</button>
          <button type="submit" class="btn btn-primary">保存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 分类编辑弹窗 -->
  <div class="modal-overlay" id="category-modal">
    <div class="modal">
      <h3 id="category-modal-title">新增分类</h3>
      <form id="category-form">
        <input type="hidden" id="cat-id">
        <div class="form-group">
          <label>分类名称 *</label>
          <input type="text" id="cat-name" required>
        </div>
        <div class="form-group">
          <label>图标(emoji)</label>
          <input type="text" id="cat-icon" placeholder="例如: ⚖️">
        </div>
        <div class="form-group">
          <label>排序</label>
          <input type="number" id="cat-sort" value="0">
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-cancel" onclick="closeCategoryModal()">取消</button>
          <button type="submit" class="btn btn-primary">保存</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/admin.js"></script>
</body>
</html>
