<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>法律助手 - 管理后台</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: #f5f5f5;
      color: #333;
    }

    /* 顶部导航 */
    .navbar {
      background: #1a6fb5;
      color: #fff;
      padding: 0 24px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .navbar .logo { font-size: 18px; font-weight: 600; }
    .navbar .btn-logout {
      background: rgba(255,255,255,0.15);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.3);
      padding: 6px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
    }

    /* 布局 */
    .layout { display: flex; height: calc(100vh - 56px); }
    .sidebar {
      width: 200px;
      background: #fff;
      border-right: 1px solid #eee;
      padding: 16px 0;
      flex-shrink: 0;
    }
    .nav-item {
      padding: 14px 24px;
      cursor: pointer;
      font-size: 14px;
      color: #666;
      border-left: 3px solid transparent;
      transition: all .2s;
    }
    .nav-item:hover { background: #f5f9ff; }
    .nav-item.active {
      color: #1a6fb5;
      background: #e8f2fb;
      border-left-color: #1a6fb5;
      font-weight: 500;
    }

    .main {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
    }

    /* 看板卡片 */
    .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 24px; }
    .stat-card {
      background: #fff;
      border-radius: 12px;
      padding: 24px;
    }
    .stat-card .label { font-size: 13px; color: #999; margin-bottom: 8px; }
    .stat-card .value { font-size: 32px; font-weight: 700; color: #1a6fb5; }
    .stat-card .sub { font-size: 12px; color: #aaa; margin-top: 4px; }

    /* 表格区域 */
    .panel {
      background: #fff;
      border-radius: 12px;
      padding: 24px;
    }
    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .panel-title { font-size: 16px; font-weight: 600; }
    .btn {
      padding: 8px 20px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-size: 13px;
    }
    .btn-primary { background: #1a6fb5; color: #fff; }
    .btn-danger { background: #f44336; color: #fff; }
    .btn-sm { padding: 4px 12px; font-size: 12px; }

    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid #f0f0f0; font-size: 13px; }
    th { color: #999; font-weight: 500; background: #fafafa; }
    tr:hover td { background: #fafbfd; }

    /* 状态标签 */
    .tag {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 500;
    }
    .tag-pending { background: #fff3e0; color: #ff9800; }
    .tag-paid { background: #e3f2fd; color: #1a6fb5; }
    .tag-delivering { background: #e8f5e9; color: #4caf50; }
    .tag-completed { background: #e8f5e9; color: #2e7d32; }
    .tag-cancelled { background: #f5f5f5; color: #999; }
    .tag-refunded { background: #fce4ec; color: #e91e63; }

    /* 弹窗 */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.show { display: flex; }
    .modal {
      background: #fff;
      border-radius: 12px;
      padding: 32px;
      width: 520px;
      max-height: 85vh;
      overflow-y: auto;
    }
    .modal-wide { width: 680px; }
    .modal h3 { margin-bottom: 20px; font-size: 18px; }
    .form-row { display: flex; gap: 16px; }
    .flex-1 { flex: 1; }
    .flex-2 { flex: 2; }
    .form-divider { border: none; border-top: 1px solid #eee; margin: 20px 0; }
    .form-hint { font-size: 12px; color: #aaa; margin-top: 4px; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 13px; color: #555; margin-bottom: 6px; font-weight: 500; }
    .form-group input, .form-group textarea, .form-group select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
    }
    .form-group textarea { min-height: 80px; resize: vertical; font-family: inherit; }
    .form-actions { display: flex; gap: 12px; justify-content: flex-end; margin-top: 24px; }
    .btn-cancel { background: #f5f5f5; color: #666; }

    /* Toast */
    .toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #4caf50;
      color: #fff;
      padding: 12px 28px;
      border-radius: 8px;
      font-size: 14px;
      z-index: 999;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .toast.show { opacity: 1; }
    .toast.error { background: #f44336; }

    .section { display: none; }
    .section.active { display: block; }

    /* 响应式 */
    @media (max-width: 768px) {
      .cards { grid-template-columns: 1fr 1fr; }
      .sidebar { width: 140px; }
    }
  </style>
</head>
<body>
  <div class="navbar">
    <span class="logo">⚖️ 法律助手 - 管理后台</span>
    <button class="btn-logout" onclick="logout()">退出</button>
  </div>

  <div class="layout">
    <!-- 侧边栏 -->
    <div class="sidebar">
      <div class="nav-item active" data-section="dashboard" onclick="switchTab('dashboard')">
        📊 数据看板
      </div>
      <div class="nav-item" data-section="products" onclick="switchTab('products')">
        📦 产品管理
      </div>
      <div class="nav-item" data-section="categories" onclick="switchTab('categories')">
        📁 分类管理
      </div>
      <div class="nav-item" data-section="orders" onclick="switchTab('orders')">
        📋 订单管理
      </div>
      <div class="nav-item" data-section="users" onclick="switchTab('users')">
        👥 用户管理
      </div>
    </div>

    <!-- 主区域 -->
    <div class="main">
      <!-- 数据看板 -->
      <div class="section active" id="section-dashboard">
        <div class="cards">
          <div class="stat-card">
            <div class="label">总订单数</div>
            <div class="value" id="stat-total-orders">-</div>
          </div>
          <div class="stat-card">
            <div class="label">今日订单</div>
            <div class="value" id="stat-today-orders">-</div>
          </div>
          <div class="stat-card">
            <div class="label">总收入</div>
            <div class="value" id="stat-total-revenue">-</div>
          </div>
          <div class="stat-card">
            <div class="label">今日收入</div>
            <div class="value" id="stat-today-revenue">-</div>
          </div>
          <div class="stat-card">
            <div class="label">总用户数</div>
            <div class="value" id="stat-total-users">-</div>
          </div>
          <div class="stat-card">
            <div class="label">今日新增用户</div>
            <div class="value" id="stat-today-users">-</div>
          </div>
        </div>
      </div>

      <!-- 产品管理 -->
      <div class="section" id="section-products">
        <div class="panel">
          <div class="panel-header">
            <span class="panel-title">产品列表</span>
            <button class="btn btn-primary" onclick="openProductModal()">+ 新增产品</button>
          </div>
          <table>
            <thead>
              <tr>
                <th>ID</th><th>名称</th><th>分类</th><th>价格(元)</th><th>状态</th><th>排序</th><th>操作</th>
              </tr>
            </thead>
            <tbody id="product-tbody"></tbody>
          </table>
        </div>
      </div>

      <!-- 分类管理 -->
      <div class="section" id="section-categories">
        <div class="panel">
          <div class="panel-header">
            <span class="panel-title">分类列表</span>
            <button class="btn btn-primary" onclick="openCategoryModal()">+ 新增分类</button>
          </div>
          <table>
            <thead>
              <tr><th>ID</th><th>图标</th><th>名称</th><th>排序</th><th>状态</th><th>操作</th></tr>
            </thead>
            <tbody id="category-tbody"></tbody>
          </table>
        </div>
      </div>

      <!-- 订单管理 -->
      <div class="section" id="section-orders">
        <div class="panel">
          <div class="panel-header">
            <span class="panel-title">订单列表</span>
            <select id="order-status-filter" onchange="loadOrders()">
              <option value="">全部状态</option>
              <option value="pending">待支付</option>
              <option value="paid">已支付</option>
              <option value="delivering">服务中</option>
              <option value="completed">已完成</option>
              <option value="cancelled">已取消</option>
              <option value="refunded">已退款</option>
            </select>
          </div>
          <table>
            <thead>
              <tr>
                <th>ID</th><th>订单号</th><th>产品</th><th>用户</th><th>金额</th><th>状态</th><th>时间</th><th>操作</th>
              </tr>
            </thead>
            <tbody id="order-tbody"></tbody>
          </table>
        </div>
      </div>

      <!-- 用户管理 -->
      <div class="section" id="section-users">
        <div class="panel">
          <div class="panel-header"><span class="panel-title">用户列表</span></div>
          <table>
            <thead>
              <tr><th>ID</th><th>昵称</th><th>手机号</th><th>来源</th><th>注册时间</th></tr>
            </thead>
            <tbody id="user-tbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- 产品编辑弹窗 -->
  <div class="modal-overlay" id="product-modal">
    <div class="modal modal-wide">
      <h3 id="product-modal-title">新增产品</h3>
      <form id="product-form">
        <input type="hidden" id="prod-id">

        <div class="form-row">
          <div class="form-group flex-2">
            <label>产品名称 *</label>
            <input type="text" id="prod-name" required>
          </div>
          <div class="form-group flex-1">
            <label>分类 *</label>
            <select id="prod-category" required></select>
          </div>
        </div>

        <div class="form-group">
          <label>副标题 / 一句话卖点</label>
          <input type="text" id="prod-subtitle" placeholder="例如：被欠薪/被辞退/没签合同？我们一步步带你走完仲裁">
        </div>

        <div class="form-row">
          <div class="form-group flex-1">
            <label>售价(元) *</label>
            <input type="number" id="prod-price" step="0.01" required>
          </div>
          <div class="form-group flex-1">
            <label>原价(元) / 划线价</label>
            <input type="number" id="prod-original-price" step="0.01">
          </div>
          <div class="form-group flex-1">
            <label>排序数字</label>
            <input type="number" id="prod-sort" value="0">
          </div>
        </div>

        <div class="form-group">
          <label>🎯 场景描述（用户痛点，显示在产品页顶部）</label>
          <textarea id="prod-scenario" rows="3" placeholder="干了几个月被辞退，工资还没结清，公司态度强硬……"></textarea>
        </div>

        <div class="form-group">
          <label>💰 ROI提示（帮用户算账，绿色背景突出显示）</label>
          <textarea id="prod-roi" rows="3" placeholder="你的案子大概值多少钱？花XX元能要回多少？"></textarea>
        </div>

        <hr class="form-divider">

        <div class="form-group">
          <label>✅ 服务内容（一行一个）</label>
          <textarea id="prod-features" rows="5" placeholder="✅ 1对1案情分析，帮你梳理可主张的全部权益&#10;✅ 定制仲裁申请书（根据你案情写的，不是模板）&#10;✅ 证据收集清单 + 取证指导&#10;✅ 仲裁全流程分步指导&#10;✅ 开庭前电话模拟辅导&#10;✅ 结案前不终止服务"></textarea>
          <div class="form-hint">每行一个服务项，以 ✅ 开头效果最好</div>
        </div>

        <div class="form-group">
          <label>🔄 服务流程（每行：步骤名 | 描述）</label>
          <textarea id="prod-process" rows="4" placeholder="提交案情 | 你通过小程序填写基本情况&#10;案情分析 | 24小时内法律顾问分析你的案件&#10;定制文书 | 我们帮你起草仲裁申请书和证据清单&#10;立案指导 | 告诉你去哪里立案、带什么材料&#10;开庭辅导 | 开庭前电话模拟&#10;全程跟进 | 每一步都有人问，直到拿到裁决书"></textarea>
          <div class="form-hint">格式：步骤名称 | 步骤描述。每行一个步骤。</div>
        </div>

        <div class="form-group">
          <label>🏆 真实案例（每行：标题 | 描述 | 结果）</label>
          <textarea id="prod-cases" rows="3" placeholder="95后女生小陈 | 入职8个月没签合同被辞退，我们帮她梳理权益全程指导 | 拿回28,000元&#10;程序员小张 | 公司拖欠3个月工资后裁员 | 拿回36,000元"></textarea>
          <div class="form-hint">格式：标题 | 描述 | 结果。每行一个案例。没有案例留空即可。</div>
        </div>

        <hr class="form-divider">

        <div class="form-group">
          <label>🛡️ 保障承诺</label>
          <input type="text" id="prod-guarantee" placeholder="例如：如果仲裁委不受理你的案子，我们全额退款。">
        </div>

        <div class="form-row">
          <div class="form-group flex-1">
            <label>上架状态</label>
            <select id="prod-active">
              <option value="1">✅ 上架（用户可见）</option>
              <option value="0">❌ 下架（隐藏）</option>
            </select>
          </div>
        </div>

        <div class="form-actions">
          <button type="button" class="btn btn-cancel" onclick="closeProductModal()">取消</button>
          <button type="submit" class="btn btn-primary">💾 保存产品</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 分类编辑弹窗 -->
  <div class="modal-overlay" id="category-modal">
    <div class="modal">
      <h3 id="category-modal-title">新增分类</h3>
      <form id="category-form">
        <input type="hidden" id="cat-id">
        <div class="form-group">
          <label>分类名称 *</label>
          <input type="text" id="cat-name" required>
        </div>
        <div class="form-group">
          <label>图标(emoji)</label>
          <input type="text" id="cat-icon" placeholder="例如: ⚖️">
        </div>
        <div class="form-group">
          <label>排序</label>
          <input type="number" id="cat-sort" value="0">
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-cancel" onclick="closeCategoryModal()">取消</button>
          <button type="submit" class="btn btn-primary">保存</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/admin.js"></script>
</body>
</html>
