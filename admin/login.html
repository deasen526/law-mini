<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理后台 - 登录</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(160deg, #1a6fb5, #0d47a1);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-box {
      background: #fff;
      border-radius: 16px;
      padding: 48px 40px;
      width: 400px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.15);
    }
    .title {
      text-align: center;
      font-size: 24px;
      font-weight: 700;
      color: #1a6fb5;
      margin-bottom: 8px;
    }
    .subtitle {
      text-align: center;
      font-size: 14px;
      color: #999;
      margin-bottom: 36px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: 14px;
      color: #555;
      margin-bottom: 8px;
      font-weight: 500;
    }
    input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      transition: border-color .2s;
    }
    input:focus { border-color: #1a6fb5; }
    .btn-login {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #1a6fb5, #2196f3);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      margin-top: 8px;
    }
    .btn-login:hover { opacity: 0.9; }
    .error-msg {
      color: #f44336;
      font-size: 13px;
      text-align: center;
      margin-top: 12px;
      display: none;
    }
    .error-msg.show { display: block; }
  </style>
</head>
<body>
  <div class="login-box">
    <div class="title">⚖️ 法律助手</div>
    <div class="subtitle">管理后台</div>
    <form id="loginForm">
      <div class="form-group">
        <label>用户名</label>
        <input type="text" id="username" placeholder="请输入管理员账号" value="admin" autocomplete="off">
      </div>
      <div class="form-group">
        <label>密码</label>
        <input type="password" id="password" placeholder="请输入密码" value="admin123456">
      </div>
      <button type="submit" class="btn-login">登 录</button>
      <div class="error-msg" id="errorMsg">账号或密码错误</div>
    </form>
  </div>

  <script>
    const API_BASE = 'http://localhost:3000/api/admin';

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('errorMsg');
      errorMsg.classList.remove('show');

      try {
        const res = await fetch(API_BASE + '/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });
        const data = await res.json();
        if (data.code === 0) {
          localStorage.setItem('admin_token', data.data.token);
          window.location.href = 'index.html';
        } else {
          errorMsg.textContent = data.msg || '登录失败';
          errorMsg.classList.add('show');
        }
      } catch (err) {
        errorMsg.textContent = '网络错误，请检查后端是否启动';
        errorMsg.classList.add('show');
      }
    });
  </script>
</body>
</html>
